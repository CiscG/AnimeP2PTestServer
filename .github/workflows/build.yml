name: Build and Release App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Dependências atualizadas com ALSA, JACK e X11
      - name: Instalar dependências Linux (Apenas no Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libpulse-dev libpipewire-0.3-dev libx11-dev libxtst-dev libxext-dev libasound2-dev libjack-dev rpm fakeroot dpkg

      - name: Instalar Dependências do Node
        run: npm ci

      - name: Compilar e Publicar
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
