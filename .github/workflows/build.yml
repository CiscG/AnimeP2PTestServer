name: Build and Release App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    # Aqui está a mágica: o robô vai rodar nos dois sistemas operacionais
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      # Dependências nativas do Linux para compilar o AppImage/deb e o módulo de áudio
      - name: Instalar dependências Linux (Apenas no Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libpulse-dev libpipewire-0.3-dev libx11-dev rpm fakeroot dpkg

      - name: Compilar e Publicar
        # O electron-builder vai detectar automaticamente o sistema e gerar o .exe (Win) ou .AppImage/.deb (Linux)
        run: npx electron-builder --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
